[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolsafe-agent-runtime"
version = "1.0.0"
description = "Auditable, policy-enforced tool calling for AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Shaiq Paracha"}]

[project.scripts]
toolsafe = "toolsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
