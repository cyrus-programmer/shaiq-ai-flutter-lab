services:
  n8n:
    image: n8nio/n8n:2.35.7
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: "false"
      TARGET_INDUSTRIES: ${TARGET_INDUSTRIES:-healthcare,saas,fintech,ecommerce}
      TARGET_COUNTRIES: ${TARGET_COUNTRIES:-US,CA,GB,DE,AU}
      SALES_OWNERS: ${SALES_OWNERS:-alex@example.com,sam@example.com}
      TZ: UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
