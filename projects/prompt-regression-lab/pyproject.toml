[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-lab"
version = "1.0.0"
description = "Dependency-free prompt regression tests and AI release gates"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Shaiq Paracha"}]

[project.scripts]
promptlab = "promptlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

