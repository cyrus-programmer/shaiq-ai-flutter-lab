name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  citeguard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/citeguard-rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        run: make check

  sla-sentinel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/n8n-sla-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate generated workflow and run tests
        run: npm test

  resilient-feature-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/flutter-resilient-feature-kit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build example for web
        run: |
          cd example
          flutter pub get
          flutter build web

  prompt-regression-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/prompt-regression-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        run: make check
      - name: Run sample evaluation gate
        run: make demo

  lead-router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/n8n-lead-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build workflow and run tests
        run: npm test

  auth-session-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/flutter-auth-session-kit
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build example for web
        run: |
          cd example
          flutter pub get
          flutter build web
